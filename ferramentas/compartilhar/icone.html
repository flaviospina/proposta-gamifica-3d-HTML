<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  html, body { background: transparent; }
  .icone { width: 512px; height: 512px; border-radius: 112px; background: linear-gradient(160deg, #F0BE5A 0%, #E0A537 55%, #C9902A 100%); display: grid; place-items: center; position: relative; overflow: hidden; }
  .icone span { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 330px; color: #161F38; line-height: 1; margin-top: -14px; }
  .icone i { position: absolute; right: -40px; bottom: -40px; width: 170px; height: 170px; background: #161F38; opacity: .12; transform: rotate(45deg); border-radius: 30px; }
</style></head><body><div class="icone"><i></i><span>G</span></div></body></html>
